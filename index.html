<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Кот-Охотник - Игра Farid</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #0f2b1f, #1e4a35);
        color: white;
        text-align: center;
        min-height: 100vh;
    }
    header {
        background: #0a1f14;
        padding: 20px;
        font-size: 36px;
        border-bottom: 6px solid #ffcc00;
    }
    .container {
        max-width: 880px;
        margin: 25px auto;
        padding: 20px;
        background: #223322;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    canvas { 
        border: 7px solid #ffcc00; 
        border-radius: 15px; 
        margin: 15px auto;
        display: block;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .info {
        font-size: 22px;
        margin: 15px 0;
        background: #1a2a1a;
        padding: 12px;
        border-radius: 10px;
    }
    .buttons {
        margin: 15px 0;
    }
    button {
        padding: 12px 25px;
        margin: 8px;
        font-size: 18px;
        background: #ffaa00;
        color: black;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }
    button:hover {
        background: #ffcc44;
        transform: scale(1.05);
    }
    footer {
        margin-top: 40px;
        padding: 20px;
        background: #0a1f14;
        font-size: 15px;
    }
</style>
</head>
<body>

<header>
    🐱 Кот-Охотник 2 🐭
</header>

<div class="container">
    <h2>Игра Farid</h2>
    
    <div class="info">
        Уровень: <span id="level">1</span> &nbsp;&nbsp;|&nbsp;&nbsp; 
        Опыт: <span id="xp">0</span>/100 &nbsp;&nbsp;|&nbsp;&nbsp; 
        Время: <span id="timer">60</span> &nbsp;&nbsp;|&nbsp;&nbsp; 
        Счёт: <span id="score">0</span>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="buttons">
        <button onclick="restartLevel()">🔄 Перезапустить уровень</button>
        <button onclick="fullRestart()">🚀 Начать игру заново</button>
    </div>
</div>

<footer>
    Сайт и игра сделаны специально для Farid ❤️ | 2026
</footer>

<script>
// ==================== ИГРА ====================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let grayCat = { x: 100, y: 250, size: 32, speed: 4.5 };
let orangeCat = { x: 680, y: 250, size: 38 };
let mice = [];
let walls = [];
let xp = 0;
let level = 1;
let timeLeft = 60;
let score = 0;
let gameOver = false;
let levelComplete = false;

const keys = {};

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function spawnMice() {
    mice = [];
    const count = level >= 3 ? 2 : 1;
    for (let i = 0; i < count; i++) {
        mice.push({ x: 300 + Math.random()*300, y: 150 + Math.random()*250, size: 16, speed: 2.8 + level*0.2 });
    }
}

function createWalls() {
    walls = [
        {x: 200, y: 150, w: 20, h: 200},
        {x: 500, y: 100, w: 20, h: 220},
        {x: 350, y: 350, w: 180, h: 20}
    ];
}

function checkWallCollision(obj) {
    for (let wall of walls) {
        if (obj.x + obj.size/2 > wall.x - wall.w/2 && obj.x - obj.size/2 < wall.x + wall.w/2 &&
            obj.y + obj.size/2 > wall.y - wall.h/2 && obj.y - obj.size/2 < wall.y + wall.h/2) {
            return true;
        }
    }
    return false;
}

// Рисование
function drawGrayCat(x, y, size) { /* тот же код что был */ 
    ctx.fillStyle = '#666666'; ctx.fillRect(x - size/2, y - size/2 + 5, size, size - 5);
    ctx.fillStyle = '#777777'; ctx.beginPath(); ctx.arc(x, y - 8, size/2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#555555';
    ctx.beginPath(); ctx.moveTo(x-12, y-22); ctx.lineTo(x-18, y-35); ctx.lineTo(x-5, y-25); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+12, y-22); ctx.lineTo(x+18, y-35); ctx.lineTo(x+5, y-25); ctx.fill();
    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(x-8, y-10, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+8, y-10, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#00aaff'; ctx.beginPath(); ctx.arc(x-8, y-10, 3, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x+8, y-10, 3, 0, Math.PI*2); ctx.fill();
}

function drawOrangeCat(x, y, size) {
    ctx.fillStyle = '#ff8800'; ctx.fillRect(x - size/2, y - size/2 + 5, size, size - 5);
    ctx.fillStyle = '#ffaa33'; ctx.beginPath(); ctx.arc(x, y - 8, size/2.2, 0, Math.PI * 2); ctx.fill();
}

function drawMouse(x, y, size) {
    ctx.fillStyle = '#555555'; ctx.beginPath(); ctx.ellipse(x, y, size/1.6, size/2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#444444'; ctx.beginPath(); ctx.arc(x + 6, y - 4, size/2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff8888'; ctx.beginPath(); ctx.arc(x+13, y-3, 2, 0, Math.PI*2); ctx.fill();
}

function update() {
    if (gameOver || levelComplete) return;

    let oldCatX = grayCat.x, oldCatY = grayCat.y;

    if (keys['ArrowLeft'] || keys['a'] || keys['A']) grayCat.x -= grayCat.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) grayCat.x += grayCat.speed;
    if (keys['ArrowUp'] || keys['w'] || keys['W']) grayCat.y -= grayCat.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S']) grayCat.y += grayCat.speed;

    grayCat.x = Math.max(30, Math.min(770, grayCat.x));
    grayCat.y = Math.max(30, Math.min(470, grayCat.y));

    if (checkWallCollision(grayCat)) { grayCat.x = oldCatX; grayCat.y = oldCatY; }

    for (let i = mice.length - 1; i >= 0; i--) {
        const mouse = mice[i];
        const oldMouseX = mouse.x;
        const oldMouseY = mouse.y;
        const dx = mouse.x - grayCat.x;
        const dy = mouse.y - grayCat.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 130 && dist > 0) {
            mouse.x += (dx / dist) * mouse.speed * 1.15;
            mouse.y += (dy / dist) * mouse.speed * 1.15;
        } else {
            mouse.x += (Math.random() - 0.5) * mouse.speed * 1.8;
            mouse.y += (Math.random() - 0.5) * mouse.speed * 1.8;
        }

        if (checkWallCollision(mouse)) { mouse.x = oldMouseX; mouse.y = oldMouseY; }

        mouse.x = Math.max(30, Math.min(770, mouse.x));
        mouse.y = Math.max(30, Math.min(470, mouse.y));

        if (dist < grayCat.size/2 + mouse.size/2 + 8) {
            mice.splice(i, 1);
            score += 10;
        }
    }

    if (mice.length === 0) {
        const dx = grayCat.x - orangeCat.x;
        const dy = grayCat.y - orangeCat.y;
        if (Math.sqrt(dx*dx + dy*dy) < 70) {
            levelComplete = true;
            xp += 30 + level * 12;
            score += 50;
            if (xp >= 100) {
                level++;
                xp -= 100;
                grayCat.speed += 0.7;
            }
            document.getElementById('level').textContent = level;
            document.getElementById('xp').textContent = Math.floor(xp);
            document.getElementById('score').textContent = score;

            setTimeout(() => {
                timeLeft = 60;
                levelComplete = false;
                createWalls();
                spawnMice();
            }, 1500);
        }
    }

    timeLeft -= 1/60;
    document.getElementById('timer').textContent = Math.ceil(timeLeft);
    if (timeLeft <= 0) gameOver = true;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#5a8';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#444';
    walls.forEach(w => ctx.fillRect(w.x - w.w/2, w.y - w.h/2, w.w, w.h));

    drawOrangeCat(orangeCat.x, orangeCat.y, orangeCat.size);
    drawGrayCat(grayCat.x, grayCat.y, grayCat.size);
    mice.forEach(m => drawMouse(m.x, m.y, m.size));

    if (levelComplete) {
        ctx.fillStyle = 'yellow';
        ctx.font = '42px Arial';
        ctx.fillText('Уровень пройден! ✅', 160, 240);
    }
    if (gameOver) {
        ctx.fillStyle = 'red';
        ctx.font = '42px Arial';
        ctx.fillText('Время вышло! 😿', 240, 250);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// Функции кнопок
function restartLevel() {
    timeLeft = 60;
    levelComplete = false;
    gameOver = false;
    createWalls();
    spawnMice();
}

function fullRestart() {
    grayCat.speed = 4.5;
    xp = 0;
    level = 1;
    score = 0;
    timeLeft = 60;
    levelComplete = false;
    gameOver = false;
    document.getElementById('level').textContent = level;
    document.getElementById('xp').textContent = xp;
    document.getElementById('score').textContent = score;
    createWalls();
    spawnMice();
}

createWalls();
spawnMice();
gameLoop();
</script>

</body>
</html>
